[versions]
kotlin = "2.4.20"
shadow = "9.6.1"
mavenPublish = "0.37.0"
paper = "26.2.build.123-stable"
spigot = "26.2-R0.1-SNAPSHOT"
bungee = "26.1-R0.1-SNAPSHOT"
snakeyaml = "2.7"
gson = "2.14.0"
junit = "6.1.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
bungee-api = { module = "net.md-5:bungeecord-api", version.ref = "bungee" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
