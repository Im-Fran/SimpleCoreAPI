name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build y tests
        run: ./gradlew build --stacktrace

      - name: Publicar el jar universal como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCoreAPI
          path: dist/build/libs/*.jar

      - name: Publicar el informe de tests si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
